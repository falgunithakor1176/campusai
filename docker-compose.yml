# ============================================================
# CampusAI – Docker Compose Configuration
# Services: PostgreSQL 16 + pgvector, Backend, Frontend
# Usage:
#   Development: docker-compose up -d postgres
#   Full stack:  docker-compose up -d
# ============================================================

version: "3.9"

services:
  # ──────────────────────────────────────────
  # PostgreSQL 16 with pgvector extension
  # ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campusai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusai_db
      POSTGRES_USER: campusai_user
      POSTGRES_PASSWORD: campusai_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusai_user -d campusai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campusai_network

  # ──────────────────────────────────────────
  # Node.js / Express API Server
  # ──────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusai_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://campusai_user:campusai_pass@postgres:5432/campusai_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.0-flash
      GEMINI_EMBEDDING_MODEL: text-embedding-004
      CORS_ORIGIN: http://localhost:3000
      STORAGE_PROVIDER: local
      MAX_FILE_SIZE_MB: 10
      UPLOAD_PATH: /app/uploads/documents
      LOG_LEVEL: info
    volumes:
      - server_uploads:/app/uploads
      - server_logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - campusai_network

  # ──────────────────────────────────────────
  # React / Vite Frontend (served via Nginx)
  # ──────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: campusai_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"
    networks:
      - campusai_network

# ──────────────────────────────────────────
# Named Volumes
# ──────────────────────────────────────────
volumes:
  postgres_data:
    name: campusai_postgres_data
  server_uploads:
    name: campusai_uploads
  server_logs:
    name: campusai_logs

# ──────────────────────────────────────────
# Networks
# ──────────────────────────────────────────
networks:
  campusai_network:
    name: campusai_network
    driver: bridge
